<!DOCTYPE html>
<html>
  <head>
    <title>Cloud-Based File Storage System</title>
      <link rel="stylesheet" href="style.css">
    </head>
  <body>
    <header>
      <h1>Cloud -Based File Storage System</h1>
      <p>EC2+S3 Based Project</p>
     </header>
    <div class="container">
      <div class="card">
        <h2>Upload File to cloud</h2>
        <input type="File" id="fileInput">
        <button onclick="uploadfile()">upload</button>
        <p id="status"></p>
      </div>
      <div class="card">
        <h2>Stored Files in S3</h2>
        <button onclick="loadfiles()">Refresh Files</button>
        <ul id="fileList"></ul>
      </div>
      <\div>
      <script src="script.js"></script>     
  </body>
</html>
